name: Deploy docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.x"

      # Pin the docs toolchain: this job holds `contents: write` (gh-pages
      # push), so an unpinned pip install would run arbitrary upstream code
      # with repository write access.
      - name: Install MkDocs Material
        run: pip install --no-cache-dir "mkdocs-material==9.8.0"

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
