name: Devcontainer

on:
  push:
    branches:
      - main
    paths:
      - ".devcontainer/**"
  pull_request:
    branches:
      - main
    paths:
      - ".devcontainer/**"
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Create env file from template
        run: cp .devcontainer/.env.example .devcontainer/.env

      - name: Build devcontainer
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca  # v0.3.1900000450
        with:
          runCmd: |
            sigrok-cli --version
            yamllint --version
            golangci-lint version
            gh --version
            node --version
            markdownlint-cli2 --version
